name: Training SP Build

on:
  push:
    paths:
      - "lab-sp/**"
      - ".github/workflows/lab-sp-build.yml"
  pull_request:
    paths:
      - "lab-sp/**"
      - ".github/workflows/lab-sp-build.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lab-sp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lab-sp/pom.xml

      - name: Verify training SP
        run: mvn -B -ntp verify

      - name: Build training SP container
        run: docker build -t acmehr-training-sp:test .

      - name: Smoke test training SP container
        run: |
          docker run -d --name acmehr-training-sp-smoke -p 8000:8000 acmehr-training-sp:test

          cleanup() {
            docker logs acmehr-training-sp-smoke || true
            docker rm -f acmehr-training-sp-smoke || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/actuator/health > /tmp/acmehr-health.json; then
              ready=true
              break
            fi
            sleep 2
          done

          test "$ready" = "true"
          grep -q '"status":"UP"' /tmp/acmehr-health.json
          curl --fail --silent http://localhost:8000/ | grep -q "Waiting for IDP_METADATA_URL"
